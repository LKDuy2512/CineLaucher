# Builds FreeMyTV.apk on GitHub and puts it in Releases.
# Put this file at .github/workflows/build-apk.yml in your fork, then Actions -> Build APK -> Run workflow.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      city:
        description: "City name shown on the weather card"
        default: "Ho Chi Minh City"
      latitude:
        description: "Latitude (decimal degrees)"
        default: "10.7769"
      longitude:
        description: "Longitude (decimal degrees)"
        default: "106.7009"
      region:
        description: "Country code for streaming availability (VN, US, GB...)"
        default: "VN"
      temperature:
        description: "C, F or auto"
        default: "C"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK pieces
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "build-tools;34.0.0" "platforms;android-34" >/dev/null

      # Updates must be signed with the same key, so the keystore is kept between runs.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: freemytv.keystore
          key: freemytv-keystore-v1

      - name: Settings
        env:
          CITY: ${{ inputs.city }}
          LAT: ${{ inputs.latitude }}
          LON: ${{ inputs.longitude }}
          REGION: ${{ inputs.region }}
          TEMP: ${{ inputs.temperature }}
        run: |
          {
            echo "tmdb_key="
            echo "tmdb_region=$REGION"
            echo "latitude=$LAT"
            echo "longitude=$LON"
            echo "city=$CITY"
            echo "language=auto"
            echo "show_crypto=true"
            echo "currency=USD"
            echo "temperature=$TEMP"
            echo "disable_assistant=false"
          } > config.properties

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-apk
          path: FreeMyTV.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" FreeMyTV.apk \
            --title "Free My TV (build ${{ github.run_number }})" \
            --notes "Built by GitHub Actions." --latest
            
